<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Stock Management</title>
  </head>
  <body>
    <h1>Dental Practice Stock</h1>

    <form method="POST">
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" required />
      <br /><br />

      <label for="description">Description:</label>
      <input type="text" name="description" id="description" required />
      <br /><br />

      <label for="manufacturer">Manufacturer:</label>
      <input type="text" name="manufacturer" id="manufacturer" required />
      <br /><br />

      <label for="quantity">Quantity:</label>
      <input type="number" name="quantity" id="quantity" required />
      <br /><br />

      <button type="submit">Add Product</button>
    </form>

    <h2>Stock List</h2>

    {% if products %} {% for product in products %}

    <section class="product-grid">
      <article class="product-card">
        <h3 class="product-name">{{ product.name }}</h3>
        <img class="product-img" src="" />
        <p class="product-manufacturer">{{ product.manufacturer }}</p>
        <p class="stock-quatity">{{ product.stock_quantity }}</p>
      </article>
    </section>

    {% endfor %} {% else %}
    <p>No products in stock.</p>
    {% endif %}
  </body>
</html>
