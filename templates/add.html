{% extends "base.html" %} {% block title %} Add Form {% endblock %} {% block
content %}
<form method="POST" action="{{ url_for('add_product') }}">
  <label for="name">Name:</label>
  <input type="text" name="name" id="name" required />

  <label for="manufacturer">Manufacturer:</label>
  <input type="text" name="manufacturer" id="manufacturer" required />

  <label for="description">Description:</label>
  <textarea name="description" id="description" required></textarea>

  <label for="link">Link to the product:</label>
  <textarea name="link" id="link" required></textarea>

  <label for="quantity">Quantity:</label>
  <input type="number" name="quantity" id="quantity" min="0" required />

  <label for="provider">Provider:</label>

  <select name="provider_id" id="provider" required>
    {% for provider in providers %}
    <option value="{{ provider.id }}">{{ provider.name }}</option>
    {% endfor %}
  </select>

  <button type="submit">Add Product</button>
</form>

{% endblock %}
