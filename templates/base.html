<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>{% block title %} Stock Management {% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  </head>

   <body>

    <header class="w-100">
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Logo"
        class="image"
      />
      <div>
        <h1>Dental Inventory App</h1>
        <p>The solution for managing dental inventory</p>
      </div>

      <nav>
        <a href="{{ url_for('home') }}"> Home </a>
        <a href="{{ url_for('stock') }}"> Stock </a>
      </nav>
    </header>

     <main class="content">{% block content %}{% endblock %}</main>

    <footer class="w-100 mt-4">
      <p>&copy; 2026 Dental Inventory App. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

</html>
